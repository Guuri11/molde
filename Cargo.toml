[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Dependencias optimizadas también en desarrollo: el parser de Treesitter en C y serde
# en debug multiplican la latencia de completion y el tiempo de los tests.
[profile.dev.package."*"]
opt-level = 2
